services:
  fastapi-service:
    build: .
    container_name: internify-fastapi
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./service:/app/service
    ports:
      - "8000:8000"
    restart: unless-stopped

  telegram-bot:
    build: .
    container_name: internify-telegram-bot
    command: ["python", "-m", "bot.main"]
    env_file: .env
    ports:
      # Live agent dashboard: open http://localhost:8080 (bound to localhost only)
      - "127.0.0.1:8080:8080"
    volumes:
      - ./output:/app/output
      - ./service:/app/service
      - ./bot:/app/bot
    depends_on:
      - fastapi-service
    restart: unless-stopped

  # Optional: puts the bot's website (home, privacy, terms, live dashboard) on your own domain through
  # Cloudflare, with no ports opened on the server. Start with:  docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: internify-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - telegram-bot
    restart: unless-stopped
