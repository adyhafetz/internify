services:
  fastapi-service:
    build: .
    container_name: internify-fastapi
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./service:/app/service
    ports:
      - "8000:8000"
    restart: unless-stopped

  telegram-bot:
    build: .
    container_name: internify-telegram-bot
    command: ["python", "-m", "bot.main"]
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./service:/app/service
      - ./bot:/app/bot
    depends_on:
      - fastapi-service
    restart: unless-stopped
