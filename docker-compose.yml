services:
  fastapi-service:
    build: .
    container_name: internify-fastapi
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./service/fact_store:/app/service/fact_store
    ports:
      - "8000:8000"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: internify-n8n
    env_file: .env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      - fastapi-service
    restart: unless-stopped

volumes:
  n8n_data:
