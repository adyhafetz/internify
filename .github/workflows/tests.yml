# Runs the offline tests (no keys, no network services needed: AI, Telegram, GitHub and websites are faked) and a quick
# code check on every pull request and every push to main, so a broken change shows red before it is merged.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: sk-test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # the same Python as the Docker image
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes
      - name: Code check (pyflakes)
        run: python -m pyflakes $(git ls-files '*.py')
      - name: Offline tests
        run: |
          failed=0
          for t in scripts/test_*.py; do
            [ "$t" = scripts/test_mock_pipeline.py ] && continue   # needs a real OpenAI key
            echo "::group::$t"
            if python "$t"; then echo "PASS $t"; else echo "::error::FAIL $t"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
